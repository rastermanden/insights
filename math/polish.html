<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reverse Polish Notation Calculator</title>
    <style>
        body {
            font-family: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }

        .calculator {
            width: 450px;
            max-width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 0;
            box-shadow: none;
            border: 1px solid #e0e0e0;
            box-sizing: border-box;
        }

        h2 {
            color: #0f62fe;
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .input-group {
            display: flex;
            align-items: center;
            margin: 15px 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        label {
            flex: 1;
            color: #525252;
            font-size: 14px;
            font-weight: 500;
            min-width: 120px;
        }

        input {
            width: 100px;
            padding: 8px 12px;
            border: 1px solid #c6c6c6;
            border-radius: 0;
            font-size: 14px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            flex-grow: 1;
            max-width: 200px;
        }

        input:focus {
            outline: none;
            border-color: #0f62fe;
            box-shadow: none;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 0;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            min-width: 80px;
        }

        #enterBtn {
            background: #0f62fe;
            color: white;
        }

        #enterBtn:hover {
            background: #0050e6;
            transform: translateY(-2px);
        }

        #clearBtn {
            background: #8c8c8c;
            color: white;
        }

        #clearBtn:hover {
            background: #525252;
            transform: translateY(-2px);
        }

        #stackDisplay {
            margin-top: 25px;
            padding: 20px;
            background: #ffffff;
            border-radius: 0;
            border: 1px solid #e0e0e0;
            color: #161616;
            font-size: 14px;
            min-height: 50px;
        }

        #stackDisplay p {
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        #stackDisplay span {
            font-weight: 600;
            color: #161616;
        }

        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            border-radius: 0;
            border: 1px solid #edf5ff;
        }

        .instructions h3 {
            color: #0f62fe;
            font-size: 16px;
            margin-bottom: 10px;
        }

        .instructions p {
            color: #525252;
            font-size: 13px;
            margin: 5px 0;
        }

        #error {
            color: #da1e28;
            font-size: 13px;
            margin-top: 10px;
            display: none;
            text-align: center;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .calculator {
                width: 90%;
                padding: 20px;
            }

            h2 {
                font-size: 20px;
            }

            .input-group {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            label {
                font-size: 13px;
                min-width: unset;
            }

            input {
                width: 100%;
                max-width: unset;
                font-size: 13px;
                padding: 6px 10px;
            }

            .button-group {
                gap: 10px;
            }

            button {
                padding: 8px 16px;
                font-size: 13px;
                min-width: 70px;
            }

            #stackDisplay {
                padding: 15px;
                font-size: 13px;
            }

            .instructions h3 {
                font-size: 14px;
            }

            .instructions p {
                font-size: 12px;
            }

            #error {
                font-size: 12px;
            }
        }

        @media (max-width: 400px) {
            .calculator {
                padding: 15px;
            }

            h2 {
                font-size: 18px;
                margin-bottom: 15px;
            }

            .input-group {
                margin: 10px 0;
            }

            label {
                font-size: 12px;
            }

            input {
                font-size: 12px;
                padding: 5px 8px;
            }

            button {
                padding: 6px 12px;
                font-size: 12px;
                min-width: 60px;
            }

            #stackDisplay {
                padding: 10px;
                font-size: 12px;
                min-height: 40px;
            }

            .instructions {
                padding: 10px;
            }

            .instructions h3 {
                font-size: 13px;
                margin-bottom: 8px;
            }

            .instructions p {
                font-size: 11px;
            }
        }
    </style>
    <link rel="stylesheet" href="../styles.css">
    <!-- pwa-install-marker -->
    <link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png">
    <link rel="manifest" href="../manifest.webmanifest">
    <meta name="theme-color" content="#0f62fe">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Insights">
    <meta name="mobile-web-app-capable" content="yes">
    <script src="../pwa.js" defer></script>

</head>
<body>
    <div class="calculator">
        <h2>RPN Calculator</h2>
        
        <div class="input-group">
            <label for="input">Enter number or operator:</label>
            <input type="text" id="input" placeholder="e.g., 3, +, -" aria-label="Enter number or operator">
        </div>
        
        <div class="button-group">
            <button id="enterBtn" aria-label="Process input">Enter</button>
            <button id="clearBtn" aria-label="Clear stack">Clear</button>
        </div>
        
        <div id="stackDisplay" aria-live="polite">
            <p>Stack: <span id="stackContent"></span></p>
        </div>

        <div id="error" role="alert"></div>
        
        <div class="instructions">
            <h3>How to Use</h3>
            <p>Enter numbers or operators (+, -, *, /) one at a time and press Enter or click the Enter button.</p>
            <p>Example: To calculate 3 + 4, enter: 3 [Enter], 4 [Enter], + [Enter].</p>
            <p>Results are shown in the stack below. Use the Clear button to reset the stack.</p>
        </div>
    </div>

    <script>
        class RPNCalculator {
            constructor() {
                this.stack = [];
                this.errorDisplay = document.getElementById('error');
                this.stackContent = document.getElementById('stackContent');
            }

            process(token) {
                this.errorDisplay.style.display = 'none';
                token = token.trim();

                if (!token) {
                    this.showError("Input cannot be empty");
                    return;
                }

                if (token !== '' && !isNaN(Number(token))) {
                    this.stack.push(Number(token));
                } else {
                    if (this.stack.length < 2) {
                        this.showError("Not enough operands!");
                        return;
                    }
                    const b = this.stack.pop();
                    const a = this.stack.pop();
                    
                    const round = n => parseFloat(n.toPrecision(10));
                    switch(token) {
                        case '+':
                            this.stack.push(round(a + b));
                            break;
                        case '-':
                            this.stack.push(round(a - b));
                            break;
                        case '*':
                            this.stack.push(round(a * b));
                            break;
                        case '/':
                            if (b === 0) {
                                this.showError("Division by zero!");
                                this.stack.push(a);
                                this.stack.push(b);
                                return;
                            }
                            this.stack.push(round(a / b));
                            break;
                        default:
                            this.showError("Unknown operator!");
                            this.stack.push(a);
                            this.stack.push(b);
                            return;
                    }
                }
                this.updateDisplay();
            }

            clear() {
                this.stack = [];
                this.errorDisplay.style.display = 'none';
                this.updateDisplay();
            }

            updateDisplay() {
                this.stackContent.textContent = this.stack.join(' ');
            }

            showError(message) {
                this.errorDisplay.textContent = message;
                this.errorDisplay.style.display = 'block';
            }
        }

        const calculator = new RPNCalculator();

        function processInput() {
            const input = document.getElementById('input').value;
            calculator.process(input);
            document.getElementById('input').value = '';
        }

        function clearStack() {
            calculator.clear();
        }

        const enterBtn = document.getElementById('enterBtn');
        const clearBtn = document.getElementById('clearBtn');
        const inputField = document.getElementById('input');

        enterBtn.addEventListener('click', processInput);
        clearBtn.addEventListener('click', clearStack);
        inputField.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                processInput();
            }
        });
    </script>
</body>
</html>
